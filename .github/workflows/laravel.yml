name: Storefront checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  storefront-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate server syntax
        run: node --check server.js

      - name: Validate storefront scripts
        run: |
          node --check product-interactivity.js
          node --check checkout-validation.js
          node --check form-validation.js

      - name: Verify required pages and assets
        run: |
          test -f index.html
          test -f products.html
          test -f about.html
          test -f contact.html
          test -f faq.html
          test -f checkout.html
          test -f images/about.png
