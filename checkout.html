<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Jonaj's Shoe Palace</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header>
        <h1>Welcome to Jonaj's Shoe Palace</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="checkout.html">Checkout</a></li>
				<li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Checkout</h2>
        <form id="checkout-form" action="submit_checkout.php" method="post">
            <section class="form-section">
                <h3>Your Shipping Address</h3>
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>
                <label for="address">Physical Address:</label>
                <input type="text" id="address" name="address" required>
                <label for="contacts">Mobile Number:</label>
                <input type="text" id="mobile-number" name="mobile-number" required>
            </section>
			<section class="form-section">
				<h3>Payment Information</h3>
				<label for="payment-method">Payment Method:</label>
				<select id="payment-method" name="payment-method" required>
					<option value="mpesa">M-Pesa</option>
					<option value="Airtel Money">Airtel Money</option>
					<option value="Telcom">T. Cash</option>
					<option value="card">Credit/Debit Card</option>
				</select>

				<div id="mpesa-payment" style="display: none;">
					<label for="phone-number">Phone Number:</label>
					<input type="text" id="phone-number" name="phone-number" required>
					<label for="amount">Amount:</label>
					<input type="text" id="amount" name="amount" required>
					<button type="button" id="mpesa-button">Pay with Airtel Money</button>
				</div>				
				<div id="AirtelMoney-payment" style="display: none;">
					<label for="phone-number">Phone Number:</label>
					<input type="text" id="phone-number" name="phone-number" required>
					<label for="amount">Amount:</label>
					<input type="text" id="amount" name="amount" required>
					<button type="button" id="AirtelMoney-button">Pay with Airtel Money</button>
				</div>

				<div id="TCash-payment" style="display: none;">
					<label for="phone-number">Phone Number:</label>
					<input type="text" id="phone-number" name="phone-number" required>
					<label for="amount">Amount:</label>
					<input type="text" id="amount" name="amount" required>
					<button type="button" id="TCash-button">Pay with T. Cash</button>
				</div>

				<div id="card-payment" style="display: none;">
					<label for="card-number">Card Number:</label>
					<input type="text" id="card-number" name="card-number" required>
					<label for="expiry-date">Expiry Date:</label>
					<input type="text" id="expiry-date" name="expiry-date" required>
					<label for="cvv">CVV:</label>
					<input type="text" id="cvv" name="cvv" required>
				</div>
			</section>
			<section class="form-section">
                <h3>Order Summary</h3>
                <p id="order-summary"></p>
            </section>
            <button type="submit">Complete Purchase</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Jonaj's Shoe Palace</p>
    </footer>
    <script src="product-interactivity.js"></script>
	<script src="checkout-validation.js"></script>
	<script src="script.js"></script>
</body>
</html>
